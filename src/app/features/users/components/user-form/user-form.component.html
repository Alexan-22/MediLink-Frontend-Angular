<div class="container mt-4">


    <div class="card">


        <div class="card-header">


            <h3>


                {{ esEdicion

                ? 'Editar Usuario'

                : 'Nuevo Usuario'

                }}


            </h3>


        </div>



        <div class="card-body">



            <form


            (ngSubmit)="guardar()"


            >




                <div class="mb-3">


                    <label>


                        Usuario


                    </label>



                    <input


                    class="form-control"


                    [(ngModel)]="usuario.username"


                    name="username"


                    required>



                </div>





                <div


                *ngIf="!esEdicion"


                class="mb-3">


                    <label>


                        Contraseña


                    </label>



                    <input


                    type="password"


                    class="form-control"


                    [(ngModel)]="usuario.password"


                    name="password"


                    required>



                </div>





                <div class="mb-3">


                    <label>


                        Rol


                    </label>



                    <select


                    class="form-select"


                    [(ngModel)]="usuario.rol"


                    name="rol">



                        <option


                        *ngFor="let r of roles"


                        [value]="r">


                            {{r}}


                        </option>



                    </select>



                </div>





                <button


                class="btn btn-primary me-2"


                type="submit">


                    Guardar


                </button>





                <button


                class="btn btn-secondary"


                type="button"


                (click)="cancelar()">


                    Cancelar


                </button>



            </form>


        </div>


    </div>


</div>
