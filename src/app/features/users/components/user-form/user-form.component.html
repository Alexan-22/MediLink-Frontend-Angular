<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>{{ esEdicion ? 'Editar Usuario' : 'Nuevo Usuario' }}</h3>
    </div>

    <div class="card-body">
      <form (ngSubmit)="guardar()">
        <div class="mb-3">
          <label for="username">Usuario</label>
          <input id="username" class="form-control"
                 [(ngModel)]="usuario.username" name="username" required>
        </div>

        <div *ngIf="!esEdicion" class="mb-3">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input id="password"
                   [type]="mostrarPassword ? 'text' : 'password'"
                   class="form-control"
                   [(ngModel)]="usuario.password"
                   name="password" autocomplete="new-password" required>

            <button type="button" class="password-toggle"
                    (click)="mostrarPassword = !mostrarPassword"
                    [attr.aria-pressed]="mostrarPassword"
                    aria-controls="password">
              <i class="bi" aria-hidden="true"
                 [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
              {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label for="rol">Rol</label>
          <select id="rol" class="form-select"
                  [(ngModel)]="usuario.rol" name="rol">
            <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
          </select>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Guardar</button>
          <button class="btn btn-secondary" type="button"
                  (click)="cancelar()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
