<div class="container mt-4">


<div class="card">


<div class="card-header">


<h3>


Cambiar Contraseña


</h3>


</div>



<div class="card-body">



<div class="mb-3">


<label>


Nueva Contraseña


</label>



<input


type="password"


class="form-control"


[(ngModel)]="password">


</div>





<div class="mb-3">


<label>


Confirmar Contraseña


</label>



<input


type="password"


class="form-control"


[(ngModel)]="confirmPassword">


</div>





<button


class="btn btn-primary me-2"


(click)="guardar()">



Guardar


</button>




<button


class="btn btn-secondary"


(click)="cancelar()">



Cancelar


</button>



</div>



</div>


</div>
