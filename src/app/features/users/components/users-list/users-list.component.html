<section class="users-page">
  <div class="users-card">
    <header class="page-header">
      <div>
        <h2><i class="bi bi-people" aria-hidden="true"></i> Usuarios</h2>
        <p>Administra las cuentas y los roles de MediCitas.</p>
      </div>
      <button type="button" class="button primary" (click)="nuevoUsuario()">
        Nuevo usuario
      </button>
    </header>

    <p class="record-count">{{ usuarios.length }} usuarios en el listado</p>

    <div class="table-container" *ngIf="usuarios.length">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let usuario of usuarios">
            <td class="id-cell">#{{ usuario.id }}</td>
            <td>
              <div class="user-info">
                <span class="avatar">{{ usuario.username.slice(0, 1).toUpperCase() }}</span>
                <strong>{{ usuario.username }}</strong>
              </div>
            </td>
            <td>
              <span class="role-badge"
                    [class.admin]="usuario.rol === 'ADMIN'"
                    [class.medico]="usuario.rol === 'MEDICO'"
                    [class.paciente]="usuario.rol === 'PACIENTE'"
                    [class.recepcionista]="usuario.rol === 'RECEPCIONISTA'"
                    [class.enfermera]="usuario.rol === 'ENFERMERA'">
                {{ usuario.rol }}
              </span>
            </td>
            <td>
              <div class="row-actions" *ngIf="usuario.id != null">
                <button type="button" class="action edit" (click)="editar(usuario.id!)">Editar</button>
                <button type="button" class="action password" (click)="password(usuario.id!)">Contraseña</button>
                <button type="button" class="action delete" (click)="eliminar(usuario.id!)">Eliminar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="empty-state" *ngIf="!usuarios.length">
      <h3>No hay usuarios para mostrar</h3>
      <button type="button" class="button secondary" (click)="cargarUsuarios()">Actualizar</button>
    </div>
  </div>
</section>
