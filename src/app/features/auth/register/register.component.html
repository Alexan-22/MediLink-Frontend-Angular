<div class="register-container">
  <div class="register-card">
    <div class="logo-section">
      <i class="bi bi-person-plus-fill" aria-hidden="true"></i>
      <h2>Crear cuenta de paciente</h2>
      <p>Regístrate como paciente en MediLink</p>
    </div>

    <form #registroForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="registerUsername">Usuario</label>
        <div class="input-group">
          <i class="bi bi-person-fill" aria-hidden="true"></i>
          <input id="registerUsername" type="text" name="username"
                 [(ngModel)]="registerData.username"
                 placeholder="Ingrese un usuario" autocomplete="username"
                 [disabled]="guardando || !!successMessage" required>
        </div>
      </div>

      <div class="form-group">
        <label for="registerPassword">Contraseña</label>
        <div class="input-group">
          <i class="bi bi-lock-fill" aria-hidden="true"></i>
          <input id="registerPassword" type="password" name="password"
                 [(ngModel)]="registerData.password"
                 placeholder="Mínimo 8 caracteres" autocomplete="new-password"
                 [disabled]="guardando || !!successMessage" minlength="8" required>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <div class="input-group">
          <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
          <input id="confirmPassword" type="password" name="confirmPassword"
                 [(ngModel)]="confirmPassword"
                 placeholder="Repita su contraseña" autocomplete="new-password"
                 [disabled]="guardando || !!successMessage" minlength="8" required>
        </div>
      </div>

      <button type="submit" class="btn-primary"
              [disabled]="registroForm.invalid || guardando || !!successMessage">
        <i class="bi bi-person-plus-fill" aria-hidden="true"></i>
        {{ guardando ? 'Registrando...' : 'Crear cuenta de paciente' }}
      </button>

      <p class="success" *ngIf="successMessage" role="status">
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        {{ successMessage }}
      </p>

      <p class="error" *ngIf="errorMessage" role="alert">
        <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
        {{ errorMessage }}
      </p>

      <p class="login-link">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login">Iniciar sesión</a>
      </p>
    </form>
  </div>
</div>
