<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <i class="bi bi-heart-pulse-fill" aria-hidden="true"></i>
      <h2>MediLink</h2>
      <p>Sistema de Gestión Médica</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="loginUsername">Usuario</label>
        <div class="input-group">
          <i class="bi bi-person-fill" aria-hidden="true"></i>
          <input id="loginUsername" type="text" name="username"
                 [(ngModel)]="loginData.username"
                 placeholder="Ingrese su usuario" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <div class="input-group">
          <i class="bi bi-lock-fill" aria-hidden="true"></i>
          <input id="loginPassword" type="password" name="password"
                 [(ngModel)]="loginData.password"
                 placeholder="Ingrese su contraseña"
                 autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
        Ingresar
      </button>

      <p class="error" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </p>

      <p class="register-link">
        ¿Eres paciente y no tienes cuenta?
        <a routerLink="/auth/register">Regístrate aquí</a>
      </p>
    </form>
  </div>
</div>
