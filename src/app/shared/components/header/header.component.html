<header class="app-header">
  <div class="logo">
    <h2>Medicitas</h2>
  </div>

  <div class="user-info">
    <span>
      Bienvenido, <strong>{{ authService.getUsername() }}</strong> ({{ authService.getRole() }})
    </span>

    <button routerLink="/profile" class="profile-btn">Mi Perfil</button>
    <button (click)="logout()" class="logout-btn">Cerrar Sesión</button>
  </div>
</header>
