<aside class="sidebar">
  <header class="sidebar-brand">
    <span class="brand-icon material-icons" aria-hidden="true">local_hospital</span>
    <div>
      <strong>MediCitas</strong>
      <small>Gestión médica</small>
    </div>
  </header>

  <div class="sidebar-account">
    <span class="avatar" aria-hidden="true">
      {{ username.slice(0, 1).toUpperCase() || 'U' }}
    </span>
    <div class="account-info">
      <strong>{{ username || 'Usuario' }}</strong>
      <span>{{ nombreRol }}</span>
    </div>
  </div>

  <p class="menu-title">Menú principal</p>

  <nav aria-label="Menú principal">
    <ul>
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.path" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
           ariaCurrentWhenActive="page">
          <span class="material-icons" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <footer class="sidebar-footer">
    <span class="material-icons" aria-hidden="true">favorite</span>
    <span>Sistema de Gestión Médica</span>
  </footer>
</aside>
